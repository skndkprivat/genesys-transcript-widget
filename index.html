<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transcript &amp; Resumé Widget</title>
<style>
  :root{
    --bg:#F6F8FA; --surface:#FFFFFF; --ink:#17212B; --ink-soft:#5A6B7B;
    --line:#E2E8EE; --accent:#0E7A8A; --accent-ink:#0A5763;
    --live:#0E8A5D; --warn:#B4530A; --err:#B0263C;
    --cust:#EDF3FB; --cust-edge:#B9CFEA; --agent:#F0F6EF; --agent-edge:#C2DCC0;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --radius:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); font-size:13.5px; line-height:1.45;
    display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; gap:8px;
    padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:5;
  }
  header h1{font-size:14px; font-weight:650; letter-spacing:.2px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .pill{
    font-family:var(--mono); font-size:10.5px; padding:2px 8px; border-radius:999px;
    border:1px solid var(--line); color:var(--ink-soft); background:var(--bg); white-space:nowrap;
  }
  .pill.live{color:#fff; background:var(--live); border-color:var(--live)}
  .pill.live::before{content:"●"; margin-right:5px; animation:pulse 1.2s infinite}
  .pill.auth-ok{color:var(--accent-ink); border-color:var(--accent); background:#EAF5F7}
  .pill.auth-no{color:var(--err); border-color:#E7C2CA; background:#FBF0F2}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  nav{display:flex; background:var(--surface); border-bottom:1px solid var(--line)}
  nav button{
    flex:1; padding:8px 4px; border:0; background:none; cursor:pointer; font:inherit;
    color:var(--ink-soft); border-bottom:2px solid transparent; font-weight:550;
  }
  nav button.active{color:var(--accent-ink); border-bottom-color:var(--accent)}
  nav button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
  main{flex:1; overflow:auto; padding:10px 12px 20px}
  .tab{display:none}
  .tab.active{display:block}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px}
  button.btn{
    font:inherit; font-weight:600; padding:7px 12px; border-radius:var(--radius);
    border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer;
  }
  button.btn:hover{background:var(--accent-ink)}
  button.btn.secondary{background:var(--surface); color:var(--accent-ink)}
  button.btn.secondary:hover{background:#EAF5F7}
  button.btn.stop{background:var(--err); border-color:var(--err)}
  button.btn:disabled{opacity:.45; cursor:not-allowed}
  button.btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  .hint{font-size:12px; color:var(--ink-soft); margin:4px 0 10px}
  .msgbar{font-size:12px; padding:7px 10px; border-radius:var(--radius); margin-bottom:10px; display:none}
  .msgbar.show{display:block}
  .msgbar.info{background:#EAF5F7; color:var(--accent-ink); border:1px solid #BFE0E6}
  .msgbar.warn{background:#FBF2E8; color:var(--warn); border:1px solid #EBD3B8}
  .msgbar.err{background:#FBF0F2; color:var(--err); border:1px solid #E7C2CA}
  /* transcript stream */
  #stream{display:flex; flex-direction:column; gap:6px}
  .utt{max-width:88%; padding:6px 10px; border-radius:10px; border:1px solid}
  .utt .meta{font-family:var(--mono); font-size:10px; color:var(--ink-soft); margin-bottom:2px; display:flex; gap:8px}
  .utt.customer{align-self:flex-start; background:var(--cust); border-color:var(--cust-edge)}
  .utt.agent{align-self:flex-end; background:var(--agent); border-color:var(--agent-edge)}
  .utt.interim{opacity:.55; border-style:dashed}
  .empty{color:var(--ink-soft); font-size:12.5px; text-align:center; padding:24px 8px}
  /* forms */
  label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin:10px 0 3px}
  input[type=text],input[type=password],select,textarea{
    width:100%; font:inherit; padding:7px 9px; border:1px solid var(--line);
    border-radius:var(--radius); background:var(--surface); color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent)}
  textarea{resize:vertical; min-height:70px}
  fieldset{border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px 12px; margin-bottom:14px; background:var(--surface)}
  legend{font-size:12px; font-weight:700; color:var(--accent-ink); padding:0 6px}
  .keyrow{display:flex; gap:6px}
  .keyrow input{flex:1}
  .keyrow button{flex:none}
  #summaryOut{
    white-space:pre-wrap; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:12px; min-height:120px; font-size:13px;
  }
  #summaryOut:empty::before{content:attr(data-empty); color:var(--ink-soft); font-size:12.5px}
  .spin{display:inline-block; width:13px; height:13px; border:2px solid #fff; border-top-color:transparent; border-radius:50%; animation:rot .8s linear infinite; vertical-align:-2px; margin-right:6px}
  @keyframes rot{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.pill.live::before,.spin{animation:none}}
  #logView{background:#101820;color:#D7E1EA;border-radius:var(--radius);padding:10px 12px;
    font-family:var(--mono);font-size:11px;line-height:1.5;min-height:200px;max-height:60vh;overflow:auto}
  .logrow{display:flex;gap:10px;white-space:pre-wrap;word-break:break-word}
  .logrow.warn span:last-child{color:#F0B460}
  .logrow.err span:last-child{color:#F08A9B}
  .logts{color:#5F7285;flex:none}
  .footer-note{font-size:11px; color:var(--ink-soft); font-family:var(--mono); margin-top:16px; word-break:break-all}
</style>
</head>
<body>
<header>
  <h1 id="t-title">Transcript &amp; Resumé</h1>
  <span id="livePill" class="pill" hidden>LIVE</span>
  <span id="authPill" class="pill auth-no">–</span>
</header>
<nav>
  <button id="nav-transcript" class="active" data-tab="transcript">Transskription</button>
  <button id="nav-summary" data-tab="summary">Resumé</button>
  <button id="nav-settings" data-tab="settings">Opsætning</button>
  <button id="nav-log" data-tab="log">Log</button>
</nav>
<main>
  <div id="msg" class="msgbar" role="status"></div>

  <!-- TRANSCRIPT TAB -->
  <section id="tab-transcript" class="tab active">
    <div class="row">
      <button class="btn" id="btnLive"></button>
      <button class="btn secondary" id="btnFetch"></button>
      <button class="btn secondary" id="btnCopyT"></button>
      <button class="btn secondary" id="btnClear"></button>
    </div>
    <p class="hint" id="t-hint-transcript"></p>
    <div id="stream"><div class="empty" id="t-empty"></div></div>
  </section>

  <!-- SUMMARY TAB -->
  <section id="tab-summary" class="tab">
    <label id="t-lbl-focus" for="focusPoints"></label>
    <textarea id="focusPoints" rows="3"></textarea>
    <label id="t-lbl-provider" for="provider"></label>
    <div class="row">
      <select id="provider" style="flex:1">
        <option value="openai">OpenAI</option>
        <option value="gemini">Google Gemini</option>
        <option value="claude">Anthropic Claude</option>
        <option value="ollama">Ollama (lokal)</option>
      </select>
      <select id="sumLang" style="flex:1">
        <option value="da">Dansk</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
      </select>
    </div>
    <div class="row">
      <button class="btn" id="btnSummarize"></button>
      <button class="btn secondary" id="btnCompare"></button>
      <button class="btn secondary" id="btnCopyS"></button>
    </div>
    <div id="summaryOut" data-empty=""></div>
  </section>

  <!-- LOG TAB -->
  <section id="tab-log" class="tab">
    <div class="row">
      <button class="btn secondary" id="btnLogCopy"></button>
      <button class="btn secondary" id="btnLogSave"></button>
      <button class="btn secondary" id="btnLogClear"></button>
    </div>
    <div id="logView"></div>
  </section>

  <!-- SETTINGS TAB -->
  <section id="tab-settings" class="tab">
    <fieldset>
      <legend id="t-leg-genesys">Genesys Cloud</legend>
      <label id="t-lbl-region" for="region"></label>
      <select id="region">
        <option value="mypurecloud.de">EU Central (mypurecloud.de)</option>
        <option value="mypurecloud.ie">EU West / Ireland (mypurecloud.ie)</option>
        <option value="euw2.pure.cloud">EU West 2 / London (euw2.pure.cloud)</option>
        <option value="euc2.pure.cloud">EU Central 2 / Zürich (euc2.pure.cloud)</option>
        <option value="mypurecloud.com">US East (mypurecloud.com)</option>
        <option value="usw2.pure.cloud">US West (usw2.pure.cloud)</option>
        <option value="cac1.pure.cloud">Canada (cac1.pure.cloud)</option>
        <option value="aps1.pure.cloud">Asia Pacific (aps1.pure.cloud)</option>
      </select>
      <label id="t-lbl-grant" for="authType"></label>
      <select id="authType">
        <option value="pkce">Code Authorization / PKCE</option>
        <option value="implicit">Token Implicit Grant (Browser)</option>
      </select>
      <label id="t-lbl-clientid" for="clientId"></label>
      <input type="text" id="clientId" autocomplete="off" spellcheck="false">
      <label id="t-lbl-convid" for="convId"></label>
      <input type="text" id="convId" autocomplete="off" spellcheck="false" placeholder="{{gcConversationId}}">
      <div class="row" style="margin-top:10px">
        <input type="checkbox" id="autoStart" checked style="width:auto">
        <label id="t-lbl-autostart" for="autoStart" style="margin:0; font-weight:600"></label>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="btnLogin"></button>
        <button class="btn secondary" id="btnLogout"></button>
      </div>
    </fieldset>

    <fieldset>
      <legend id="t-leg-ai">AI</legend>
      <label for="keyOpenai">OpenAI API key</label>
      <div class="keyrow">
        <input type="password" id="keyOpenai" autocomplete="off">
        <input type="text" id="modelOpenai" style="max-width:150px" placeholder="gpt-4o-mini">
      </div>
      <label for="keyGemini">Gemini API key</label>
      <div class="keyrow">
        <input type="password" id="keyGemini" autocomplete="off">
        <input type="text" id="modelGemini" style="max-width:150px" placeholder="gemini-2.0-flash">
      </div>
      <label for="keyClaude">Claude API key</label>
      <div class="keyrow">
        <input type="password" id="keyClaude" autocomplete="off">
        <input type="text" id="modelClaude" style="max-width:150px" placeholder="claude-sonnet-4-5">
      </div>
      <p class="hint" id="t-hint-keys"></p>
      <label id="t-lbl-ollama" for="ollamaUrl"></label>
      <div class="keyrow">
        <input type="text" id="ollamaUrl" autocomplete="off" spellcheck="false" placeholder="http://localhost:11434">
        <input type="text" id="modelOllama" style="max-width:150px" placeholder="llama3.1">
      </div>
      <p class="hint" id="t-hint-ollama"></p>
      <label id="t-lbl-proxy" for="proxyUrl"></label>
      <input type="text" id="proxyUrl" autocomplete="off" spellcheck="false" placeholder="https://ai-proxy.example.workers.dev">
      <p class="hint" id="t-hint-proxy"></p>
      <label id="t-lbl-action" for="gcActionId"></label>
      <input type="text" id="gcActionId" autocomplete="off" spellcheck="false" placeholder="custom_-_xxxxxxxx-....">
      <p class="hint" id="t-hint-action"></p>
    </fieldset>

    <fieldset>
      <legend id="t-leg-ui">UI</legend>
      <label id="t-lbl-uilang" for="uiLang"></label>
      <select id="uiLang">
        <option value="da">Dansk</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
      </select>
    </fieldset>

    <div class="row"><button class="btn" id="btnSave"></button></div>
    <p class="footer-note" id="verNote">Genesys Transcript &amp; Summary Widget v1.4.0</p>
  </section>
</main>

<script>
/* ============================================================
   Genesys Cloud Transcript & AI Summary — Interaction Widget
   Modes:
     A) Realtime: Notifications API topic v2.conversations.{id}.transcription
        (requires Voice Transcription enabled; Low Latency = 3-5s delay)
     B) Fetch: GET /api/v2/speechandtextanalytics/conversations/{cid}/
        communications/{commId}/transcripturl

   Auth: OAuth2 Code Authorization + PKCE (default) or Implicit Grant
